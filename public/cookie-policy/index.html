<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie policy — Imagina Srl Società Benefit</title>
<meta name="robots" content="noindex">
<!-- Pagina autosufficiente: prima si appoggiava a /assets/contest.css e al
     logo del contest, che sono usciti con l'archiviazione del 02/10/2026.
     Resta a questo indirizzo perché è linkata da fuori. Lo stile è qui
     dentro, nei colori delle pagine Imagina: così non dipende da niente.
     Il contenuto della policy lo genera CookieYes, ed è l'unico motivo per
     cui questa pagina esiste. -->
<style>
  :root{
    --bg:#faf9f6; --ink:#1b1a1f; --ink-soft:rgba(27,26,31,.66);
    --filo:rgba(27,26,31,.13); --accento:#05606a;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .policy-wrap{ max-width:820px; margin:0 auto; padding:56px 20px 60px; }
  .policy-wrap h1{ font-size:clamp(1.7rem,5vw,2.3rem); line-height:1.15; margin:0 0 14px; }
  .policy-wrap .lead{ color:var(--ink-soft); font-size:1.02rem; line-height:1.65; margin:0 0 8px; max-width:62ch; }
  .policy-actions{ margin:18px 0 26px; display:flex; gap:14px; flex-wrap:wrap; }
  .policy-actions a{ color:var(--accento); font-weight:700; text-decoration:none; cursor:pointer;
    border-bottom:1px solid var(--filo); padding-bottom:2px; }
  .policy-actions a:hover{ border-bottom-color:var(--accento); }
  .policy-wrap a.back{ display:inline-block; margin-top:36px; padding-top:18px;
    border-top:1px solid var(--filo); color:var(--accento); font-weight:700; text-decoration:none; }
  /* contenitore generato da CookieYes */
  #cky-cookie-policy, .cky-cookie-policy{ margin-top:8px; }
</style>
</head>
<body>

  <div class="policy-wrap">
    <h1>Cookie policy</h1>
    <p class="lead">Questa pagina elenca i cookie e le tecnologie di tracciamento utilizzati su questo sito e le relative finalità. Puoi rivedere o modificare le tue scelte in qualsiasi momento.</p>
    <div class="policy-actions">
      <a data-cky-tag="revisit-consent">Gestisci le preferenze cookie</a>
    </div>

    <!-- Start CookieYes cookie policy -->
    <script id="cky-cookie-policy" type="text/javascript" src="https://cdn-cookieyes.com/client_data/07bc8b3a4b1da0fac9ea02b8022bf82d/cookie-policy/script.js"></script>
    <!-- End CookieYes cookie policy -->

    <a class="back" href="/">← Torna alla home</a>
  </div>

</body>
</html>
